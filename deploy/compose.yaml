name: ebook-library

x-api: &api
  image: ebook-library-api:local
  build:
    context: ..
    dockerfile: backend/Dockerfile
  user: "${EBOOK_UID:-10001}:${EBOOK_GID:-10001}"
  environment:
    EBOOK_DATA_DIR: /data
    EBOOK_TRUSTED_ORIGINS: '["${EBOOK_PUBLIC_ORIGIN:?Set EBOOK_PUBLIC_ORIGIN in deploy/.env}"]'
    EBOOK_SESSION_COOKIE_SECURE: "${EBOOK_SESSION_COOKIE_SECURE:-true}"
    EBOOK_MAX_UPLOAD_BYTES: "104857600"
  volumes:
    - type: bind
      source: ${EBOOK_DATA_PATH:?Set EBOOK_DATA_PATH in deploy/.env}
      target: /data
      bind:
        create_host_path: false
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=256m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  mem_limit: 1g
  networks: [library]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

services:
  api:
    <<: *api
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
  maintenance:
    <<: *api
    profiles: [tools]
    command: [python, -m, app.cli, --help]
    volumes:
      - type: bind
        source: ${EBOOK_DATA_PATH:?Set EBOOK_DATA_PATH}
        target: /data
        bind: {create_host_path: false}
      - type: bind
        source: ${EBOOK_BACKUP_PATH:?Set EBOOK_BACKUP_PATH in deploy/.env}
        target: /backups
        bind: {create_host_path: false}
  web:
    image: ebook-library-web:local
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    networks: [library]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  gateway:
    image: nginx:stable-alpine
    user: "101:101"
    entrypoint: [nginx, -g, "daemon off;"]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:${EBOOK_HTTP_PORT:-8787}:8080"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    networks: [library]
    depends_on:
      web: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/api/v1/health]
      interval: 20s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

networks:
  library:
    internal: true
